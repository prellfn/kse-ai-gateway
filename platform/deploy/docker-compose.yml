# KAIP docker compose：平台（必选）+ OpenCode 与 KAIP 客户端（profile agent）+ 下载代理（profile proxy）
# KSE 原生安装在宿主机或另一台服务器（需许可证激活），不在 compose 内。
#
#   cd deploy && cp compose.env.example .env && vi .env          # KSE 地址、端口、注册令牌
#   docker compose up -d                                          # 平台；首次构建镜像（离线包内有 wheels 时无需联网）
#   docker compose logs kaip | grep 初始管理员密码                 # 或 docker compose exec kaip cat /var/lib/kaip/initial_admin_password.txt
#   echo <注册令牌> > kaip_enroll_token.txt                        # 容器化 OpenCode 首次注册用，之后可清空
#   docker compose --profile agent run --rm opencode              # 带 KAIP 防护的 OpenCode（交互式）
#
# 已有镜像包时先导入：docker load -i kaip-images-<版本>.tar.gz
name: kaip

services:
  kaip:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: kaip-platform:${KAIP_VERSION:-1.0.0}
    container_name: kaip-platform
    # host 网络：直连宿主机 127.0.0.1 上的 KSE；接收 KSE syslog（UDP）
    network_mode: host
    env_file: ./kaip.env
    environment:
      KAIP_PORT: ${KAIP_PORT:-8080}
      KAIP_SYSLOG_PORT: ${KAIP_SYSLOG_PORT:-5514}
      KAIP_KSE_URL: ${KAIP_KSE_URL:-http://127.0.0.1:1234}
      KAIP_KSE_SCAN_DIR_REMOTE: ${KAIP_KSE_SCAN_DIR_REMOTE:-}
      KAIP_KSE_SCANFILE_THRESHOLD: ${KAIP_KSE_SCANFILE_THRESHOLD:-26214400}
      KAIP_RUNTIME_DIR: /opt/kaip/runtime
    volumes:
      - kaip-data:/var/lib/kaip
      # ≥25MB 文件写入该目录后由 KSE 按路径扫描（目录须对 UID 10001 可写，并在 KSE 允许扫描的目录中）
      - ${KAIP_SCAN_DIR:-/opt/kaspersky/scanqueue}:/opt/kaspersky/scanqueue
      # 终端私有 Node.js 运行时（离线包 runtime/），供无 Node 的终端一键安装时下载
      - ../runtime:/opt/kaip/runtime:ro
    restart: unless-stopped

  # 容器化 OpenCode + KAIP 客户端：启动时自动注册（首次）、安装插件、后台监控
  opencode:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: deploy/opencode-container/Dockerfile
      args:
        BASE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.15.13}
    image: kaip-opencode:${OPENCODE_VERSION:-1.15.13}
    hostname: ${OPENCODE_HOSTNAME:-oc-kaip}        # 平台事件中的终端名
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAIP_SERVER: ${KAIP_SERVER_FOR_AGENT:-http://host.docker.internal:8080}
    secrets:
      - kaip_enroll_token                         # 注册令牌以文件挂载，不进入容器环境变量（仅首次需要）
    volumes:
      - kaip-state:/root/.kaip                    # 注册信息
      - opencode-data:/root/.local/share/opencode # 模型密钥（opencode auth login）
      - ${WORKSPACE:-./workspace}:/workspace
    stdin_open: true
    tty: true

  # 可选：下载代理（Squid HTTPS 解密 → KSE ICAP）。推荐原生安装 deploy/squid/install-squid.sh（已实测）；
  # Docker 方式需确认镜像中的 Squid 带 OpenSSL，并先按 squid/squid.conf 开头的说明生成 CA
  squid:
    profiles: ["proxy"]
    image: ubuntu/squid:latest
    container_name: kaip-squid
    network_mode: host
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/certs:/etc/squid/certs:ro
    restart: unless-stopped

volumes:
  kaip-data:
  kaip-state:
  opencode-data:

secrets:
  # 首次注册前把控制台「接入部署」中的令牌写入该文件；注册完成后可清空（文件需保留）
  kaip_enroll_token:
    file: ./kaip_enroll_token.txt
