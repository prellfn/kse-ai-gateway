# Nginx HTTPS 反向代理（终端与平台之间的流量包含代码/文件内容，生产环境务必启用 HTTPS）
server {
    listen 443 ssl;
    server_name kaip.example.local;
    ssl_certificate     /etc/kaip/tls/kaip.crt;
    ssl_certificate_key /etc/kaip/tls/kaip.key;
    client_max_body_size 0;          # 大模型文件上传
    proxy_request_buffering off;     # 流式上传，不在 nginx 落盘
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
