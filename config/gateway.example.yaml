# KSE + AI 安全扫描平台 — 网关配置示例
# 复制为 gateway.yaml 后按实际环境修改; 真实密钥请放在 .env 或 systemd EnvironmentFile 中

server:
  listen: "0.0.0.0:8000"      # Scan Gateway
  upload_listen: "0.0.0.0:8002"  # Upload Gateway (8001 被 ClickHouse 占用)

kse:
  url: "https://127.0.0.1:8443"
  token: "${KSE_TOKEN}"        # 明文 Token, 不要提交到仓库
  timeout: 120                 # 秒
  verify_tls: false
  # KSE 路径扫描 API: POST /api/v3.0/scanfile  {"timeout":"60000","object":"/path"}
  # URL 扫描 API:    POST /api/v3.0/checkurl   {"timeout":"60000","object":"https://..."}

paths:
  scan_queue: "/opt/kaspersky/scanqueue"    # 唯一允许扫描的基目录
  quarantine: "/opt/kaspersky/quarantine"   # 检出威胁隔离区
  allowed_scan_dirs:
    - "/opt/kaspersky/scanqueue"
    - "/root/ai-stack/ollama/models/blobs"
  audit_log: "/opt/ai-stack/scan-gateway/logs/audit.jsonl"

limits:
  max_file_size: 104857600     # 100MB
  max_upload_size: 104857600
  allowed_ext:
    - .pdf
    - .doc
    - .docx
    - .txt
    - .md
    - .csv
    - .xlsx
    - .pptx
    - .epub

policy:
  # Scan Gateway / Upload Gateway: Fail-Closed, 扫描异常不放行
  on_malicious: block
  on_suspicious: quarantine
  on_scan_error: block
  # OpenClaw Plugin: Fail-Open, 扫描异常不阻断业务
  agent_plugin_on_scan_error: allow

anythingllm:
  url: "http://10.0.0.1:3001"
  api_key: "${ANYTHINGLLM_API_KEY}"
  workspace_slug: "${WORKSPACE_SLUG}"

agent:
  openclaw_plugin:
    scan_gateway: "http://10.0.0.1:8000"
    timeout: 15
  windows_watcher:
    scan_gateway: "http://10.0.0.1:8000"
    poll_interval: 5
    max_size: 104857600         # 超过 100MB 跳过
    exclude_dirs:
      - "\\out\\"
      - "\\state\\"
      - "\\.clawhub\\"
      - "\\logs\\"
      - "\\tmp\\"
    exclude_ext:
      - .log
      - .tmp
      - .lock
      - .pid
      - .sqlite-wal
      - .sqlite-shm

watcher:
  ollama:
    watch_dir: "/root/ai-stack/ollama/models/blobs"
    min_size: 10485760          # 小于 10MB 跳过
    timeout: 600                # 大模型扫描超时(秒)
    log: "/var/log/ollama-watcher.log"

audit:
  retain_days: 90
# ===========================================================================
# v1.1 新增：MCP Server / 隔离区复核台 / URL 扫描 / 压缩包深度扫描
# ===========================================================================

mcp_server:
  # MCP Server 以 stdio 运行，由客户端拉起；此处为其环境变量
  scan_gateway: "http://127.0.0.1:8000"
  timeout: 300
  max_text_bytes: 52428800
  tools:
    - scan_file        # 扫描本机文件
    - scan_text        # 扫描文本内容（内存，不落盘）
    - scan_url         # 扫描 URL（钓鱼 / 恶意链接）
    - scan_skill_pkg   # 深度扫描 Skill / 插件压缩包
    - kse_status       # 网关连通性与配置状态

quarantine_console:
  listen: "0.0.0.0:8004"
  scan_gateway: "http://127.0.0.1:8000"
  quarantine_dir: "/opt/kaspersky/quarantine"
  audit_log: "/opt/ai-stack/scan-gateway/logs/audit.jsonl"
  max_audit_lines: 2000
  # 默认无鉴权，请置于反向代理（Nginx + Basic Auth / mTLS）之后
  auth_required: false

url_scan:
  enabled: true
  timeout: 60
  # 需在 KSE Web UI -> Settings -> Service ->
  # "Locations where remote scanning is allowed" 中放行相应 URL
  block_on_detect: true

package_scan:
  enabled: true
  timeout: 300
  # 压缩包炸弹与 Zip Slip 防护阈值
  max_members: 5000
  max_unpacked_bytes: 524288000
  max_compression_ratio: 100
  formats: [zip, tar, tar.gz, tar.bz2, tar.xz]