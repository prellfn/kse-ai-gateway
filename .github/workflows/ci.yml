name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r gateway/requirements.txt ruff

      - name: Ruff 静态检查
        run: ruff check gateway/ scripts/ --output-format=github

      - name: Python 语法编译检查
        run: python -m compileall -q gateway/

      - name: 配置示例 YAML 校验
        run: |
          pip install pyyaml
          python -c "import yaml;yaml.safe_load(open('config/gateway.example.yaml',encoding='utf-8'));print('YAML OK')"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          additional_files: >-
            ./watchers/ollama-watcher.sh
            ./integrations/opencode/install.sh
            ./integrations/workbuddy/install.sh
            ./integrations/workbuddy/skill/scripts/scan.sh
            ./integrations/workbuddy/skill/scripts/download-and-scan.sh
          severity: error

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 插件加载检查
        working-directory: agent/openclaw-plugin
        run: node -e "require('./index.js'); console.log('OK')"

      - name: 接入层 JS 语法检查
        run: |
          node --check integrations/common/kse-client.js
          cp integrations/opencode/plugin/kse-gate.js /tmp/kse-gate.mjs
          node --check /tmp/kse-gate.mjs
          node -e "require('./integrations/common/kse-client.js'); console.log('CLIENT OK')"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否误提交密钥
        run: |
          if grep -rInE "(gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)" --exclude-dir=.git . ; then
            echo "::error::疑似提交了密钥"
            exit 1
          fi
          echo "未发现硬编码密钥"

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 启动 Mock Scan Gateway
        run: |
          nohup python3 scripts/mock_scan_gateway.py --port 18000 > /tmp/mock.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18000/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18000/health

      - name: OpenClaw 插件拦截自测
        run: |
          node integrations/common/plugin-probe.js agent/openclaw-plugin/index.js http://127.0.0.1:18000

      - name: 探针在网关不可达时应报错而非误判通过
        run: |
          set +e
          node integrations/common/plugin-probe.js agent/openclaw-plugin/index.js http://127.0.0.1:19999
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::网关不可达时探针不应返回 0"; exit 1
          fi
          echo "行为正确 (exit=$code)"

      - name: Mock 模式端到端 (Scan Gateway 层)
        run: |
          chmod +x scripts/verify.sh
          KSE_SCAN_GATEWAY=http://127.0.0.1:18000 \
          SCAN_GATEWAY=http://127.0.0.1:18000 \
          UPLOAD_GATEWAY=http://127.0.0.1:19998 \
          CONSOLE_URL=http://127.0.0.1:19997 \
          ./scripts/verify.sh --layer l1 || true