name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r lite/gateway/requirements.txt ruff

      - name: Ruff 静态检查
        run: ruff check lite/gateway/ lite/scripts/ --output-format=github

      - name: Python 语法编译检查
        run: python -m compileall -q lite/gateway/ lite/scripts/

      - name: 配置示例 YAML 校验
        run: |
          pip install pyyaml
          python -c "import yaml;yaml.safe_load(open('config/gateway.example.yaml',encoding='utf-8'));print('YAML OK')"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./lite/scripts
          additional_files: >-
            ./lite/watchers/ollama-watcher.sh
            ./integrations/opencode/install.sh
            ./integrations/workbuddy/install.sh
            ./integrations/workbuddy/skill/scripts/scan.sh
            ./integrations/workbuddy/skill/scripts/download-and-scan.sh
          severity: error

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 插件加载检查
        working-directory: agent/openclaw-plugin
        run: node -e "require('./index.js'); console.log('OK')"

      - name: 接入层 JS 语法检查
        run: |
          node --check integrations/common/kse-client.js
          cp integrations/opencode/plugin/kse-gate.js /tmp/kse-gate.mjs
          node --check /tmp/kse-gate.mjs
          node -e "require('./integrations/common/kse-client.js'); console.log('CLIENT OK')"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查是否误提交密钥
        run: |
          if grep -rInE "(gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)" --exclude-dir=.git . ; then
            echo "::error::疑似提交了密钥"
            exit 1
          fi
          echo "未发现硬编码密钥"

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 启动 Mock KSE (模拟卡巴斯基引擎, 拒绝远程路径扫描)
        run: |
          nohup python3 lite/scripts/mock_kse.py --port 18123 --reject-remote > /tmp/mockkse.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18123/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18123/health

      - name: 启动真实 Scan Gateway (零依赖实现) 连 Mock KSE
        run: |
          mkdir -p /tmp/ci/{scanqueue,quarantine,logs}
          cd lite/gateway/scan-gateway
          KSE_URL=http://127.0.0.1:18123 \
          KSE_MODE=auto \
          SCAN_QUEUE=/tmp/ci/scanqueue \
          QUARANTINE=/tmp/ci/quarantine \
          ALLOWED_SCAN_DIRS=/tmp/ci/scanqueue,/tmp/ci/quarantine \
          AUDIT_LOG=/tmp/ci/logs/audit.jsonl \
          LISTEN_PORT=18100 \
          nohup python3 app.py > /tmp/ci/gateway.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18100/health > /dev/null; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18100/health

      - name: Scan Gateway 端到端 (EICAR 检出 + 自动回退 scanmemory + 隔离)
        run: |
          python3 -c "s=''.join(map(chr,[88,53,79,33,80,37,64,65,80,91,52,92,80,90,88,53,52,40,80,94,41,55,67,67,41,55,125,36,69,73,67,65,82,45,83,84,65,78,68,65,82,68,45,65,86,73,82,85,83,45,84,69,83,84,45,70,73,76,69,33,36,72,43,72,42]));open('/tmp/ci/scanqueue/eicar.txt','w').write(s)"
          R=$(curl -sf -X POST http://127.0.0.1:18100/scan/file -H "Content-Type: application/json" \
                -d '{"file_path":"/tmp/ci/scanqueue/eicar.txt","timeout":60}')
          echo "$R"
          echo "$R" | grep -q '"verdict": "DETECT"' || { echo "::error::未检出 EICAR"; exit 1; }
          echo "$R" | grep -q '"scan_mode": "memory"' || { echo "::error::未回退到 scanmemory"; exit 1; }
          echo "$R" | grep -q '"quarantined": true' || { echo "::error::未自动隔离"; exit 1; }

      - name: 压缩包内藏 EICAR 必须检出
        run: |
          mkdir -p /tmp/ci/pkg && cd /tmp/ci/pkg
          python3 -c "s=''.join(map(chr,[88,53,79,33,80,37,64,65,80,91,52,92,80,90,88,53,52,40,80,94,41,55,67,67,41,55,125,36,69,73,67,65,82,45,83,84,65,78,68,65,82,68,45,65,86,73,82,85,83,45,84,69,83,84,45,70,73,76,69,33,36,72,43,72,42]));open('/tmp/ci/pkg/payload.sh','w').write(s)"
          python3 -c "import zipfile;z=zipfile.ZipFile('/tmp/ci/bad.zip','w');z.write('/tmp/ci/pkg/payload.sh','payload.sh');z.close()"
          R=$(curl -sf -X POST http://127.0.0.1:18100/scan/package -F "file=@/tmp/ci/bad.zip")
          echo "$R"
          echo "$R" | grep -q '"verdict": "DETECT"' || { echo "::error::压缩包内 EICAR 未检出"; exit 1; }

      - name: OpenClaw 插件拦截自测
        run: |
          node integrations/common/plugin-probe.js agent/openclaw-plugin/index.js http://127.0.0.1:18100

      - name: 探针在网关不可达时应报错而非误判通过
        run: |
          set +e
          node integrations/common/plugin-probe.js agent/openclaw-plugin/index.js http://127.0.0.1:19999
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::网关不可达时探针不应返回 0"; exit 1
          fi
          echo "行为正确 (exit=$code)"

      - name: Mock KSE 引擎端点自测
        run: |
          python3 lite/scripts/mock_kse.py --help > /dev/null
          curl -sf -X POST http://127.0.0.1:18123/api/v3.0/checkurl \
            -H "Content-Type: application/octet-stream" \
            -d '{"url":"http://malicious.example.com/"}' | grep -q DETECT
          echo "URL 扫描端点正常"

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 平台 Python 语法检查
        run: python -m compileall -q platform/server/app platform/mcp-server

      - name: 平台 MCP Server 自检 (tools/list)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python3 platform/mcp-server/server.py 2>/dev/null > /tmp/mcp.json
          cat /tmp/mcp.json
          python3 -c "
          import json
          d=[json.loads(l) for l in open('/tmp/mcp.json') if l.strip()]
          tools=[t['name'] for r in d if 'result' in r and 'tools' in r.get('result',{}) for t in r['result']['tools']]
          need={'kaip_scan_file','kaip_scan_text','kaip_check_url','kaip_evaluate','kaip_policy','kaip_status','kaip_report'}
          missing=need-set(tools)
          assert not missing, 'missing tools: %s' % missing
          print('MCP tools OK: %d' % len(tools))
          "

      - name: 平台客户端 JS 语法检查
        run: |
          for f in platform/client/bin/*.js platform/client/lib/*.js platform/client/adapters/opencode/*.js; do
            node --check "$f"
          done

      - name: 平台 Shell 脚本检查
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck platform/deploy/*.sh platform/deploy/offline/*.sh platform/client/scripts/*.sh || \
            echo "::warning::平台脚本存在 ShellCheck 告警 (上游代码, 不阻断构建)"
